name: Links

# The outbound-link check, on a schedule rather than on every pull request
# (github-pages-deployment.spec.md §6.5). The eighteen links in the sign records
# point at a host this repository does not control, so link rot is real and worth
# catching — but it is not caused by a commit, and gating a contributor's pull
# request on a third party's uptime is the wrong trade.

on:
  schedule:
    # Mondays, early UTC. Nothing here is time-sensitive; weekly is enough to
    # notice a slug that moved before a visitor does.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The whole harness, with the link check switched on. Everything else in it
      # is deterministic and already green on main, so a failure here is a link.
      - run: pnpm verify
        env:
          CHECK_LINKS: '1'
