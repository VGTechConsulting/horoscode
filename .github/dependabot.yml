version: 2

updates:
  # `pnpm-workspace.yaml` pins `postcss` and `sharp` through `overrides` because
  # Next's own ranges lagged behind the patched releases. An override is a
  # decision with a shelf life, and the only thing that reliably notices it has
  # expired is a bot.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One pull request for the things that always move together, so a routine
      # patch bump is one review rather than six.
      types:
        patterns:
          - '@types/*'
      next:
        patterns:
          - 'next'
          - 'eslint-config-next'
          - 'react'
          - 'react-dom'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
