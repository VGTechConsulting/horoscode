<!-- The astrolabe mark at tab scale (deployment spec §3.4) — the app's own glyph
     rather than the firm's wordmark: a circle, an inscribed triangle whose three
     points sit on it, one chord across, and a fixed star at the upper vertex.

     Two departures from the source drawing, both forced by the size: the stroke
     is thickened from 1.9 to 2.8, which is still a hairline at forty-eight but
     survives sixteen pixels, and the square is opaque, because a favicon is
     composited onto chrome, launcher, and bookmark backgrounds this file cannot
     see. Inversion is the system query and nothing else, as in app/globals.css;
     the literals are that palette's two ends plus the star, in hex because an
     SVG favicon is parsed on its own and cannot read the app's tokens. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <style>
    .bg { fill: #ffffff }
    .fg { fill: none; stroke: #0b0b0b; stroke-width: 2.8 }
    .star { fill: #e23122 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0b0b }
      .fg { stroke: #ffffff }
    }
  </style>
  <rect class="bg" width="48" height="48"/>
  <g class="fg">
    <circle cx="24" cy="24" r="19"/>
    <path d="M19.08 5.65 L6.15 30.5 L39.56 34.9 Z" stroke-linejoin="round"/>
    <line x1="6.15" y1="30.5" x2="41.85" y2="17.5"/>
  </g>
  <circle class="star" cx="19.08" cy="5.65" r="2.9"/>
</svg>
